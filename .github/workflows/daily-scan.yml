name: Daily Stock Scan

on:
  schedule:
    - cron: '0 1 * * 1-5'
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Override watchlist symbols (comma-separated, e.g. TITAN,INFY). Leave blank to use watchlist.json'
        required: false
        default: ''
  push:
    paths:
      - 'watchlist.json'

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Override watchlist if symbols provided
        if: ${{ github.event.inputs.symbols != '' }}
        env:
          SYMBOLS: ${{ github.event.inputs.symbols }}
        run: |
          python - <<PYEOF
          import json, os
          symbols = [s.strip().upper() for s in os.environ['SYMBOLS'].split(',') if s.strip()]
          with open('watchlist.json') as f:
              wl = json.load(f)
          wl['watchlist'] = symbols
          with open('watchlist.json', 'w') as f:
              json.dump(wl, f, indent=2)
          print("Watchlist overridden with:", symbols)
          PYEOF

      - name: Run stock scan
        run: python scan.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/ docs/
          git diff --staged --quiet || git commit -m "scan: $(date -u '+%Y-%m-%d %H:%M UTC') - auto update"
          git push
