name: Daily Stock Scan

on:
  schedule:
    # Runs every day at 6:30 AM IST (1:00 AM UTC)
    - cron: '0 1 * * 1-5'   # weekdays only (markets closed on weekends)

  # Manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Override watchlist (comma-separated, e.g. TITAN,INFY). Leave blank to use watchlist.json'
        required: false
        default: ''

  # Also run when watchlist.json is updated
  push:
    paths:
      - 'watchlist.json'

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push results back to repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Override watchlist if symbols provided
        if: ${{ github.event.inputs.symbols != '' }}
        run: |
          python - <<'EOF'
          import json, os
          symbols = [s.strip().upper() for s in os.environ['SYMBOLS'].split(',') if s.strip()]
          with open('watchlist.json') as f:
              wl = json.load(f)
          wl['watchlist'] = symbols
          with open('watchlist.json', 'w') as f:
              json.dump(wl, f, indent=2)
          print(f"Watchlist overridden with: {symbols}")
          EOF
        env:
          SYMBOLS: ${{ github.event.inputs.symbols }}

      - name: Run stock scan
        run: python scan.py

      - name: Commit and push results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/ docs/
          git diff --staged --quiet || git commit -m "scan: $(date -u '+%Y-%m-%d %H:%M UTC') — auto update"
          git push
